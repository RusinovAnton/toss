name: Release

# Two ways to cut a release, neither of which needs a version bumped by hand:
#
#   git tag v0.1.2 && git push origin v0.1.2   # the tag names the release
#   Actions -> Release -> Run workflow          # a blank version bumps the patch
#
# Either way the run writes that version into package.json, Cargo.toml and the
# lock file before building, so the installers are named after the release
# rather than after whatever the repository happened to say.
#
# The run leaves a draft release with the .dmg, .msi and .exe attached, so
# nothing is published until you look at it and press the button. A draft's tag
# is only created when you publish it, so a dispatched release adds no tag
# until then.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0. Blank bumps the patch number of the newest tag."
        required: false
        type: string

jobs:
  # One job decides the number so all three builds agree on it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to work out what the newest release was.
          fetch-depth: 0

      - id: pick
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$REQUESTED" ]; then
            version="${REQUESTED#v}"
          else
            latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            latest="${latest#v}"
            [ -n "$latest" ] || latest=$(node -p "require('./package.json').version")
            IFS=. read -r major minor patch <<< "$latest"
            version="$major.$minor.$((patch + 1))"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::not a version: $version"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

  build:
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon and Intel are separate binaries; Tauri does not make
          # one that runs on both.
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # No version here: it comes from packageManager in package.json, so
      # CI and this machine cannot drift apart.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # After the install, so the lock file check sees the version it expects.
      - name: Write the release version into the manifests
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.version.outputs.version }}"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The macOS bundler drives Finder over AppleScript to lay out the
          # disk image, which no runner can do. This skips that pass.
          CI: true
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: Toss v${{ needs.version.outputs.version }}
          releaseBody: |
            Nothing here is code-signed yet.

            **macOS**: open the `.dmg`, drag Toss to Applications, then
            right-click it and choose Open the first time. Apple silicon is the
            `aarch64` image, Intel is the `x64` one.

            **Windows**: run the `.msi`. SmartScreen will warn about an
            unknown publisher: choose More info, then Run anyway. Allow Toss
            through the firewall on private networks when asked, or no other
            device can reach it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
