<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Toss: a filled dot with two rings leaving it, the radar in miniature.
       Blue on near-black, and it still reads as three shapes in one colour. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0B0F14"/>
  <circle cx="512" cy="512" r="118" fill="#3B82F6"/>
  <circle cx="512" cy="512" r="210" fill="none" stroke="#3B82F6" stroke-width="24"/>
  <circle cx="512" cy="512" r="302" fill="none" stroke="#3B82F6" stroke-width="24" opacity="0.55"/>
</svg>
