[package]
name = "toss"
version = "0.1.0"
description = "LocalSend-compatible file transfer with a radar UI"
authors = ["Toss contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "toss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = "0.14.10"
sha2 = "0.11.0"
rand = "0.10.2"
uuid = { version = "1.26.1", features = ["v4"] }
rustls-pki-types = "1.15.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "fs", "io-util"] }
socket2 = { version = "0.6.5", features = ["all"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls", "stream"] }
axum = "0.8.9"
tokio-rustls = "0.26.5"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-clipboard-manager = "2.3.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
